[package]
name = "openwhisperer-cli"
version = "0.3.0"
edition = "2021"
description = "Agent-facing CLI for scheduling prompts in the OpenWhisperer desktop app"
publish = false

[[bin]]
name = "ow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
